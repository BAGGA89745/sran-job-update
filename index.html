<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRAN JOB UPDATE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:linear-gradient(135deg,#0757a8,#0b82d8);
color:white;
text-align:center;
padding:25px 15px;
}

header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}

nav{
background:white;
padding:12px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
box-shadow:0 2px 8px #0002;
}

button{
cursor:pointer;
font-weight:bold;
}

nav button{
border:0;
padding:10px 15px;
border-radius:8px;
background:#eaf2fb;
color:#0757a8;
}

nav button:hover{background:#0757a8;color:white}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.search{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 3px 10px #0001;
}

.search input{
width:100%;
padding:13px;
border:1px solid #ccd5df;
border-radius:8px;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:16px;
}

.card,.detail-card{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 3px 12px #0001;
border-left:5px solid #0757a8;
}

.badge{
display:inline-block;
background:#e7f1ff;
color:#0757a8;
padding:5px 9px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.card h2{margin:10px 0}
.card p{color:#566070;line-height:1.5}

.apply,.view-btn,.back-btn{
display:inline-block;
border:0;
background:#0757a8;
color:white;
padding:11px 16px;
text-decoration:none;
border-radius:7px;
font-weight:bold;
margin:5px 5px 5px 0;
}

.view-btn{background:#0b82d8}
.back-btn{background:#172033}

.empty{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
grid-column:1/-1;
}

.detail-card{
border-left:0;
margin-bottom:20px;
}

.detail-title{
background:linear-gradient(135deg,#0757a8,#0b82d8);
color:white;
padding:22px;
border-radius:10px;
margin-bottom:18px;
}

.detail-title h2{margin:10px 0}

.detail-section{
background:#fff;
padding:18px;
margin:14px 0;
border:1px solid #e2e8f0;
border-radius:10px;
}

.detail-section h3{
color:#0757a8;
margin-top:0;
border-bottom:2px solid #eaf2fb;
padding-bottom:10px;
}

.detail-section p{
line-height:1.7;
color:#39465a;
white-space:pre-wrap;
overflow-wrap:anywhere;
}

.detail-table{
width:100%;
border-collapse:collapse;
}

.detail-table td{
padding:11px;
border:1px solid #e2e8f0;
vertical-align:top;
overflow-wrap:anywhere;
}

.detail-table td:first-child{
font-weight:bold;
width:38%;
background:#f4f7fb;
}

footer{
margin-top:30px;
background:#172033;
color:white;
text-align:center;
padding:25px;
}

[hidden]{display:none!important}

@media(max-width:600px){
header h1{font-size:24px}
.container{padding:12px}
.detail-table td{padding:8px;font-size:14px}
}
</style>
</head>

<body>

<header>
<h1>SRAN JOB UPDATE</h1>
<p>Government Jobs • Private Jobs • Admit Card • Result • Admission Form</p>
</header>

<nav id="navigation">
<button onclick="showCategory('all')">All Updates</button>


<div class="container">

<div id="listing">

<div class="search">
<input id="search" type="text"
placeholder="Search vacancy, department, qualification..."
oninput="searchJobs()">
</div>

<div id="jobs" class="grid">
<div class="empty">Loading updates...</div>
</div>

</div>

<div id="detailsPage" hidden></div>

</div>

<footer>
<b>SRAN ENTERPRISES BHULLAN</b>
<br><br>
Online Form Apply • Job Updates
</footer>

<script>

/* SUPABASE CONNECTION */

const SUPABASE_URL = "https://ykwvyburvfevmvdnnryd.supabase.co";
const SUPABASE_KEY = "sb_publishable_jH24mIEPl186yPIDzRcYFg_nHRdegb6";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allJobs = [];
let currentCategory = "all";

/* LOAD VACANCIES */

async function loadJobs(){

const box = document.getElementById("jobs");

try{

const {data,error} = await db
.from("vacancies")
.select("*")
.order("id",{ascending:false});

if(error) throw error;

allJobs = data || [];
filterJobs();

}catch(error){

console.error(error);

box.innerHTML = `
<div class="empty">
<h3>Data load nahi ho raha</h3>
<p>${safe(error.message)}</p>
</div>`;

}

}

/* CATEGORY */

function showCategory(category){
currentCategory = category;
filterJobs();
}

/* SEARCH */

function searchJobs(){
filterJobs();
}

/* FILTER */

function filterJobs(){

const searchText = document
.getElementById("search")
.value.toLowerCase().trim();

const result = allJobs.filter(job=>{

const categoryMatch =
currentCategory === "all" ||
job.category === currentCategory;

const text = `
${job.title || ""}
${job.department || ""}
${job.qualification || ""}
${job.details || ""}
`.toLowerCase();

return categoryMatch && text.includes(searchText);

});

displayJobs(result);

}

/* DISPLAY VACANCIES */

function displayJobs(list){

const box = document.getElementById("jobs");

if(!list.length){

box.innerHTML = `
<div class="empty">
<h3>No Update Found</h3>
<p>Is category mein abhi vacancy available nahi hai.</p>
</div>`;

return;
}

box.innerHTML = "";

list.forEach(job=>{

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `

<span class="badge">
${categoryName(job.category)}
</span>

<h2>${safe(job.title)}</h2>

<p><b>Department:</b> ${safe(job.department)}</p>
<p><b>Total Posts:</b> ${safe(job.posts)}</p>
<p><b>Qualification:</b> ${safe(job.qualification)}</p>
<p><b>Age Limit:</b> ${safe(job.age)}</p>
<p><b>Application Fee:</b> ${safe(job.fee)}</p>
<p><b>Last Date:</b> ${safe(job.last_date)}</p>
<p><b>Salary:</b> ${safe(job.salary)}</p>
<p>${safe(job.details)}</p>

<button class="view-btn" type="button">
View Full Details →
</button>

${job.apply_link ? `
<a class="apply"
href="${safe(job.apply_link)}"
target="_blank"
rel="noopener noreferrer">
Apply Online →
</a>` : ""}

`;

card.querySelector(".view-btn").addEventListener("click",()=>{
openDetails(job.id);
});

box.appendChild(card);

});

}
/* CATEGORY WISE FEES */

function feeTable(job){

const fees = [
["General",job.fee_general],
["BC / OBC",job.fee_bc],
["SC",job.fee_sc],
["EWS",job.fee_ews],
["ST",job.fee_st]
];

const rows = fees
.filter(item => item[1])
.map(item => `
<tr>
<td>${item[0]}</td>
<td>${safe(item[1])}</td>
</tr>
`).join("");

if(!rows){
return `
<div class="detail-section">
<h3>Application Fees</h3>
<p>${safe(job.fee) || "Not Available"}</p>
</div>`;
}

return `
<div class="detail-section">
<h3>Category Wise Application Fees</h3>
<table class="detail-table">
${rows}
</table>
</div>`;
}
/* FULL DETAILS PAGE */

function openDetails(id){

const job = allJobs.find(item=>String(item.id)===String(id));

if(!job) return;

document.getElementById("listing").hidden = true;
document.getElementById("navigation").hidden = true;

const page = document.getElementById("detailsPage");
page.hidden = false;

const section = (heading,value)=>{

if(!value) return "";

return `
<div class="detail-section">
<h3>${heading}</h3>
<p>${safe(value)}</p>
</div>`;

};

const linkButton = (url,label)=>{

if(!url) return "";

if(!/^https?:\/\//i.test(String(url).trim())) return "";

return `
<a class="apply"
href="${safe(url)}"
target="_blank"
rel="noopener noreferrer">
${label}
</a>`;

};

page.innerHTML = `

<button class="back-btn" onclick="backToJobs()">
← Back to Vacancies
</button>

<div class="detail-card">

<div class="detail-title">

<span class="badge">${categoryName(job.category)}</span>

<h2>${safe(job.title)}</h2>

<p>${safe(job.department)}</p>

</div>

<div class="detail-section">
<h3>Quick Summary</h3>

<table class="detail-table">

<tr><td>Organization</td><td>${safe(job.department)}</td></tr>
<tr><td>Total Posts</td><td>${safe(job.posts)}</td></tr>
<tr><td>Qualification</td><td>${safe(job.qualification)}</td></tr>
<tr><td>Age Limit</td><td>${safe(job.age)}</td></tr>
<tr><td>Application Fees</td>
<td>${safe(job.fee_general || job.fee || "Check Details")}</td></tr>

<tr><td>Last Date</td><td>${safe(job.last_date)}</td></tr>
<tr><td>Salary</td><td>${safe(job.salary)}</td></tr>

</table>
</div>

${section("Important Dates",job.important_dates)}

${section("Vacancy Details",job.vacancy_details)}

${section("Educational Qualification",job.qualification)}

${section("Age Limit & Relaxation",job.age_relaxation)}

${section("Salary Details",job.salary)}

${feeTable(job)}

${section("Selection Process",job.selection_process)}

${section("Exam Pattern",job.exam_pattern)}

${section("Documents Required",job.documents_required)}

${section("How to Apply",job.how_to_apply)}

${section("Other Important Information",job.details)}

<div class="detail-section">

<h3>Important Links</h3>

${linkButton(job.apply_link,"Apply Online →")}

${linkButton(job.notification_link,"Download Notification →")}

${linkButton(job.official_website,"Official Website →")}

</div>

${section("Frequently Asked Questions (FAQs)",job.faqs)}

<button class="back-btn" onclick="backToJobs()">
← Back to Vacancies
</button>

</div>
`;

window.scrollTo({top:0,behavior:"smooth"});

}

/* BACK */

function backToJobs(){

document.getElementById("detailsPage").hidden = true;
document.getElementById("listing").hidden = false;
document.getElementById("navigation").hidden = false;

window.scrollTo({top:0,behavior:"smooth"});

}

/* CATEGORY NAME */

function categoryName(category){

if(category==="govt") return "GOVT JOB";
if(category==="private") return "PRIVATE JOB";
if(category==="admit") return "ADMIT CARD";
if(category==="result") return "RESULT";
if(category==="admission") return "ADMISSION FORM";

return "UPDATE";

}

/* TEXT SAFETY */

function safe(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* START */

loadJobs();

</script>

</body>
</html>
