
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRAN JOB UPDATE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033;
}

header{
background:linear-gradient(135deg,#0757a8,#0b82d8);
color:white;
text-align:center;
padding:25px 15px;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

nav{
background:white;
padding:12px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px;
box-shadow:0 2px 8px #0002;
}

nav button{
border:0;
padding:10px 15px;
border-radius:8px;
background:#eaf2fb;
color:#0757a8;
font-weight:bold;
cursor:pointer;
}

nav button:hover{
background:#0757a8;
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.search{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 3px 10px #0001;
}

.search input{
width:100%;
padding:13px;
border:1px solid #ccd5df;
border-radius:8px;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:16px;
}

.card{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 3px 12px #0001;
border-left:5px solid #0757a8;
}

.badge{
display:inline-block;
background:#e7f1ff;
color:#0757a8;
padding:5px 9px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.card h2{
margin:10px 0;
}

.card p{
color:#566070;
line-height:1.5;
}

.apply{
display:inline-block;
background:#0757a8;
color:white;
padding:10px 15px;
text-decoration:none;
border-radius:7px;
font-weight:bold;
}

.empty{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
grid-column:1/-1;
}

footer{
margin-top:30px;
background:#172033;
color:white;
text-align:center;
padding:25px;
}

@media(max-width:600px){
header h1{font-size:24px}
.container{padding:12px}
}
</style>
</head>

<body>

<header>
<h1>SRAN JOB UPDATE</h1>
<p>Government Jobs • Private Jobs • Admit Card • Result • Admission Form</p>
</header>

<nav>
<button onclick="showCategory('all')">All Updates</button>
<button onclick="showCategory('govt')">Govt Job</button>
<button onclick="showCategory('private')">Private Job</button>
<button onclick="showCategory('admit')">Admit Card</button>
<button onclick="showCategory('result')">Result</button>
<button onclick="showCategory('admission')">Admission Form</button>
</nav>

<div class="container">

<div class="search">
<input
id="search"
type="text"
placeholder="Search vacancy, department, qualification..."
oninput="searchJobs()">
</div>

<div id="jobs" class="grid">
<div class="empty">Loading updates...</div>
</div>

</div>

<footer>
<b>SRAN ENTERPRISES BHULLAN</b>
<br><br>
Online Form Apply • Job Updates
</footer>

<script>

/* SUPABASE DETAILS */

const SUPABASE_URL = "https://ykwvyburvfevmvdnnryd.supabase.co";

const SUPABASE_KEY = "sb_publishable_jH24mIEPl186yPIDzRcYFg_nHRdegb6";


/* SUPABASE CONNECTION */

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* VARIABLES */

let allJobs = [];

let currentCategory = "all";


/* LOAD VACANCIES */

async function loadJobs(){

const box = document.getElementById("jobs");

try{

const {data,error} = await db
.from("vacancies")
.select("*")
.order("id",{ascending:false});

if(error) throw error;

allJobs = data || [];

filterJobs();

}catch(error){

console.error("Supabase Error:",error);

box.innerHTML = `
<div class="empty">
<h3>Data load nahi ho raha</h3>
<p>Supabase connection ya database settings check karein.</p>
</div>
`;

}

}


/* CATEGORY */

function showCategory(category){

currentCategory = category;

filterJobs();

}


/* SEARCH */

function searchJobs(){

filterJobs();

}


/* FILTER */

function filterJobs(){

const searchText = document
.getElementById("search")
.value.toLowerCase().trim();

const result = allJobs.filter(job=>{

const categoryMatch =
currentCategory === "all" ||
job.category === currentCategory;

const text = `
${job.title || ""}
${job.department || ""}
${job.qualification || ""}
${job.details || ""}
`
.toLowerCase();

const searchMatch = text.includes(searchText);

return categoryMatch && searchMatch;

});

displayJobs(result);

}


/* DISPLAY */

function displayJobs(list){

const box = document.getElementById("jobs");

if(!list.length){

box.innerHTML = `
<div class="empty">
<h3>No Update Found</h3>
<p>Is category mein abhi vacancy available nahi hai.</p>
</div>
`;

return;

}

box.innerHTML = "";

list.forEach(job=>{

box.innerHTML += `

<div class="card">

<span class="badge">
${categoryName(job.category)}
</span>

<h2>${safe(job.title)}</h2>

<p><b>Department:</b> ${safe(job.department)}</p>

<p><b>Total Posts:</b> ${safe(job.posts)}</p>

<p><b>Qualification:</b> ${safe(job.qualification)}</p>

<p><b>Age Limit:</b> ${safe(job.age)}</p>

<p><b>Application Fee:</b> ${safe(job.fee)}</p>

<p><b>Last Date:</b> ${safe(job.last_date)}</p>

<p><b>Salary:</b> ${safe(job.salary)}</p>

<p>${safe(job.details)}</p>

${
job.apply_link
?
`<a class="apply"
href="${safe(job.apply_link)}"
target="_blank"
rel="noopener noreferrer">
Apply Online →
</a>`
:
""
}

</div>

`;

});

}


/* CATEGORY NAME */

function categoryName(category){

if(category==="govt") return "GOVT JOB";

if(category==="private") return "PRIVATE JOB";

if(category==="admit") return "ADMIT CARD";

if(category==="result") return "RESULT";

if(category==="admission") return "ADMISSION FORM";

return "UPDATE";

}


/* TEXT SAFETY */

function safe(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

loadJobs();

</script>

</body>
</html>
